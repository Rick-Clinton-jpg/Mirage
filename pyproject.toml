[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mirage-containment"
version = "0.1.0"
description = "A verifier for bounded AI-agent containment evidence"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
mirage = "mirage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

